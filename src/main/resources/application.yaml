spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: finance-ai-copilot
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${NEON_JDBC_URL:jdbc:postgresql://localhost:5432/finance_ai?sslmode=disable}
    username: ${NEON_DB_USER:finance_ai}
    password: ${NEON_DB_PASSWORD:}
  ai:
    model:
      chat: openai
      embedding: ollama
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          model: ${GEMINI_CHAT_MODEL:gemini-3.8-flash}
          temperature: 0.2
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      embedding:
        model: ${OLLAMA_EMBEDDING_MODEL:qwen3-embedding:0.6b}
        keep-alive: ${OLLAMA_EMBEDDING_KEEP_ALIVE:30m}
    openai:
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY:}
      chat:
        options:
          model: ${DEEPSEEK_CHAT_MODEL:deepseek-flash}
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: ${EMBEDDING_DIMENSIONS:1024}
        initialize-schema: false
        table-name: transaction_embeddings
    mcp:
      client:
        enabled: ${MCP_CLIENT_ENABLED:false}
        name: finance-ai-neon-client
        type: SYNC
        request-timeout: 20s
        streamable-http:
          connections:
            neon-postgres:
              url: ${NEON_MCP_URL:http://localhost:3000}

app:
  vector:
    datasource:
      jdbc-url: ${NEON_JDBC_URL:jdbc:postgresql://localhost:5432/finance_ai?sslmode=disable}
      username: ${NEON_DB_USER:finance_ai}
      password: ${NEON_DB_PASSWORD:}
      maximum-pool-size: 10
      # Retire connections well before Neon/PgBouncer closes an idle session (~5 min).
      max-lifetime: ${NEON_POOL_MAX_LIFETIME:240000}
      # Ping idle connections so Neon-side closures are detected proactively,
      # not when a connection is borrowed (which logs "Failed to validate connection").
      keepalive-time: ${NEON_POOL_KEEPALIVE_TIME:120000}
      idle-timeout: ${NEON_POOL_IDLE_TIMEOUT:60000}
      validation-timeout: 5000
      connection-timeout: 30000
  legacy:
    datasource:
      jdbc-url: ${LEGACY_DB_URL:jdbc:mysql://localhost:3306/legacy}
      username: ${LEGACY_DB_USER:finance_ai_reader}
      password: ${LEGACY_DB_PASSWORD:}
      read-only: true
      maximum-pool-size: 3
    query: classpath:sqls/ingestion-transactions.sql
  ai:
    ingestion:
      fixed-delay: ${AI_INGESTION_DELAY:PT5M}
      lookback-days: ${AI_INGESTION_LOOKBACK_DAYS:2}
      batch-size: 100
      request-delay: ${AI_INGESTION_REQUEST_DELAY:PT1S}

server:
  shutdown: graceful
